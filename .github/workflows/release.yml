name: Release

# Two channels from main. manifest.json holds the stable version, the only one
# the community directory reads; package.json holds the newest version, which
# may be a beta (0.5.0-beta.1). Merging a release PR is the release approval: a
# push to main that leaves either version without a tag runs the gate, creates
# the tag on that commit and publishes, a beta as a pre-release for BRAT. The
# decision lives in scripts/release-decide.mjs. Pushing a tag by hand still
# works; workflow_dispatch is the recovery path (it builds whatever ref you
# select from the Actions tab).
on:
  push:
    branches: [main]
    paths: [manifest.json, package.json]
    tags: ["*"]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  check:
    name: Decide whether to release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.decide.outputs.version }}
      kind: ${{ steps.decide.outputs.kind }}
    steps:
      - uses: actions/checkout@v7
      # Stable when manifest.json has no tag yet, beta when package.json holds
      # an untagged prerelease, otherwise nothing (a dependency-only change to
      # package.json). A pushed tag must equal one of the two versions.
      - name: Compare versions with tags
        id: decide
        run: git ls-remote --tags origin | node scripts/release-decide.mjs

  release:
    needs: check
    if: needs.check.outputs.kind != 'none'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history with tags so the release-notes step can find the
          # previous tag and build a Full Changelog compare link.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Gate: main has no required checks, so a release PR can be merged
      # before its CI finished. Nothing is published unless this passes.
      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Read version
        id: version
        run: echo "version=${{ needs.check.outputs.version }}" >> "$GITHUB_OUTPUT"

      # The build copies manifest.json, which holds the stable version. A beta
      # ships its own version in the asset so BRAT and Obsidian see it.
      - name: Stamp beta version into the manifest asset
        if: needs.check.outputs.kind == 'beta'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          jq --arg v "$VERSION" '.version = $v' dist/manifest.json > dist/manifest.tmp
          mv dist/manifest.tmp dist/manifest.json

      # Collect the release assets from dist/ that actually exist. main.js and manifest.json
      # are always present; styles.css is optional, so a plugin that needs no
      # stylesheet doesn't have to ship an empty one just to satisfy the release.
      - name: Collect release assets
        id: assets
        run: |
          FILES="dist/main.js dist/manifest.json"
          [ -f dist/styles.css ] && FILES="$FILES dist/styles.css"
          echo "list=$FILES" >> "$GITHUB_OUTPUT"
          {
            echo "paths<<EOF"
            for f in $FILES; do echo "$f"; done
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # Release notes come from CHANGELOG.md: the section headed
      # "## [<version>]" (a beta: "## [Unreleased]") up to the next "## "
      # heading or the link reference block at the end of the file. A missing
      # section only warns (a hotfix may go out without an entry); the release
      # then carries the compare link alone and the notes can be edited on
      # GitHub afterwards.
      - name: Read release notes from CHANGELOG
        id: notes
        env:
          VERSION: ${{ needs.check.outputs.kind == 'beta' && 'Unreleased' || steps.version.outputs.version }}
        run: |
          SECTION=$(awk -v v="$VERSION" '
            /^## \[/ { if (found) exit; found = ($0 ~ "^## \\[" v "\\]"); next }
            /^\[[^]]+\]: / { if (found) exit }
            found { print }
          ' CHANGELOG.md | sed -e '/./,$!d' -e :a -e '/^\n*$/{$d;N;ba' -e '}')
          if [ -z "$SECTION" ]; then
            echo "::warning::CHANGELOG.md has no section '## [$VERSION]'; release notes are the compare link only"
          fi
          {
            echo "body<<EOF"
            echo "$SECTION"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ steps.assets.outputs.paths }}

      - name: Create or update release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          ASSETS: ${{ steps.assets.outputs.list }}
          CHANGELOG_NOTES: ${{ steps.notes.outputs.body }}
          KIND: ${{ needs.check.outputs.kind }}
        run: |
          # A beta is a pre-release and never "Latest", so the stable release
          # stays the one GitHub and the directory point at.
          CHANNEL_FLAGS=""
          [ "$KIND" = beta ] && CHANNEL_FLAGS="--prerelease --latest=false"
          if gh release view "$VERSION" >/dev/null 2>&1; then
            # Re-upload only assets built from the tagged commit (a rerun or a
            # tag push); never replace a published release with a newer main.
            TAGGED=$(git rev-parse "refs/tags/$VERSION^{commit}" 2>/dev/null || true)
            if [ "$TAGGED" != "$GITHUB_SHA" ]; then
              echo "::error::Release $VERSION exists for ${TAGGED:-an unknown commit}, this run built $GITHUB_SHA; not replacing its assets"
              exit 1
            fi
            echo "Release $VERSION already exists; re-uploading assets"
            gh release upload "$VERSION" $ASSETS --clobber
          else
            # Without an existing tag, --target creates it on the commit this
            # run built. Release notes are the CHANGELOG.md section for this version,
            # followed by a Full Changelog compare link against the previous
            # tag (when one exists).
            # A stable release compares against the previous stable, not its last beta.
            PREV_TAGS=$(git tag --sort=-creatordate --merged HEAD | grep -v "^${VERSION}$" || true)
            [ "$KIND" = stable ] && PREV_TAGS=$(echo "$PREV_TAGS" | grep -v -- - || true)
            PREV_TAG=$(echo "$PREV_TAGS" | head -n 1)
            if [ -n "$PREV_TAG" ]; then
              COMPARE="**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${PREV_TAG}...${VERSION}"
            else
              COMPARE="**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/commits/${VERSION}"
            fi
            if [ -n "$CHANGELOG_NOTES" ]; then
              NOTES=$(printf "%s\n\n---\n\n%s\n" "$CHANGELOG_NOTES" "$COMPARE")
            else
              NOTES="$COMPARE"
            fi
            gh release create "$VERSION" \
              --title="$VERSION" \
              --target "$GITHUB_SHA" \
              --notes "$NOTES" \
              $CHANNEL_FLAGS \
              $ASSETS
          fi
