name: Release

# Merging a release PR is the release approval: a push to main that changes
# manifest.json to a version without a tag runs the gate, creates the tag on
# that commit and publishes. Pushing a tag by hand still works; workflow_dispatch
# is the recovery path (it builds whatever ref you select from the Actions tab).
on:
  push:
    branches: [main]
    paths: [manifest.json]
    tags: ["*"]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  check:
    name: Decide whether to release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.decide.outputs.version }}
      release: ${{ steps.decide.outputs.release }}
    steps:
      - uses: actions/checkout@v7
      # manifest.json is the source of truth for the version, so the tag and
      # the release title always match what Obsidian's plugin loader sees.
      - name: Compare manifest version with tags
        id: decide
        run: |
          VERSION=$(jq -r .version manifest.json)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          RELEASE=true
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "$VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match manifest.json version $VERSION"
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF_TYPE" = branch ] \
            && git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null; then
            echo "Tag $VERSION already exists; nothing to release"
            RELEASE=false
          fi
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"

  release:
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history with tags so the release-notes step can find the
          # previous tag and build a Full Changelog compare link.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Gate: main has no required checks, so a release PR can be merged
      # before its CI finished. Nothing is published unless this passes.
      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Read version
        id: version
        run: echo "version=${{ needs.check.outputs.version }}" >> "$GITHUB_OUTPUT"

      # Collect the release assets from dist/ that actually exist. main.js and manifest.json
      # are always present; styles.css is optional, so a plugin that needs no
      # stylesheet doesn't have to ship an empty one just to satisfy the release.
      - name: Collect release assets
        id: assets
        run: |
          FILES="dist/main.js dist/manifest.json"
          [ -f dist/styles.css ] && FILES="$FILES dist/styles.css"
          echo "list=$FILES" >> "$GITHUB_OUTPUT"
          {
            echo "paths<<EOF"
            for f in $FILES; do echo "$f"; done
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # Release notes come from CHANGELOG.md: the section headed
      # "## [<version>]" up to the next "## " heading or the link reference
      # block at the end of the file. A missing section only warns (a hotfix
      # may go out without an entry); the release then carries the compare
      # link alone and the notes can be edited on GitHub afterwards.
      - name: Read release notes from CHANGELOG
        id: notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          SECTION=$(awk -v v="$VERSION" '
            /^## \[/ { if (found) exit; found = ($0 ~ "^## \\[" v "\\]"); next }
            /^\[[^]]+\]: / { if (found) exit }
            found { print }
          ' CHANGELOG.md | sed -e '/./,$!d' -e :a -e '/^\n*$/{$d;N;ba' -e '}')
          if [ -z "$SECTION" ]; then
            echo "::warning::CHANGELOG.md has no section '## [$VERSION]'; release notes are the compare link only"
          fi
          {
            echo "body<<EOF"
            echo "$SECTION"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ steps.assets.outputs.paths }}

      - name: Create or update release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          ASSETS: ${{ steps.assets.outputs.list }}
          CHANGELOG_NOTES: ${{ steps.notes.outputs.body }}
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists; re-uploading assets"
            gh release upload "$VERSION" $ASSETS --clobber
          else
            # Without an existing tag, --target creates it on the commit this
            # run built. Release notes are the CHANGELOG.md section for this version,
            # followed by a Full Changelog compare link against the previous
            # tag (when one exists).
            PREV_TAG=$(git tag --sort=-creatordate --merged HEAD | grep -v "^${VERSION}$" | head -n 1 || true)
            if [ -n "$PREV_TAG" ]; then
              COMPARE="**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${PREV_TAG}...${VERSION}"
            else
              COMPARE="**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/commits/${VERSION}"
            fi
            if [ -n "$CHANGELOG_NOTES" ]; then
              NOTES=$(printf "%s\n\n---\n\n%s\n" "$CHANGELOG_NOTES" "$COMPARE")
            else
              NOTES="$COMPARE"
            fi
            gh release create "$VERSION" \
              --title="$VERSION" \
              --target "$GITHUB_SHA" \
              --notes "$NOTES" \
              $ASSETS
          fi
