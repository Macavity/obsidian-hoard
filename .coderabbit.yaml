# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-US
tone_instructions: "Report real bugs, data-loss risks and Obsidian guideline violations. Keep code simple and clean. Skip nitpicks that ESLint or fallow already cover."
knowledge_base:
  code_guidelines:
    filePatterns:
      - ".claude/skills/obsidian-dev/references/plugin-guidelines.md"
      - ".claude/skills/obsidian-dev/references/coding-conventions.md"
reviews:
  profile: chill
  path_filters:
    - "!hoard-test-vault/**"
    - "!screenshots/**"
  path_instructions:
    - path: "src/**"
      instructions: |
        User data lives in vault notes that several devices edit through sync. Treat any path
        that can lose or corrupt a note, its properties, History.md or Hoard.base as a
        blocking bug: concurrent edits from another device, malformed YAML, files appearing or
        disappearing mid-operation, keys dropped on re-encode. Also report mobile-only breakage
        (no Node or Electron APIs, layout below 600px). Prefer simple, readable fixes.
    - path: "src/import/watchlog/**"
      instructions: |
        User-driven import of WatchLog / WatchLog Sync data as a copy; the source must stay
        untouched. This folder (plus the import wizard UI) is the only place that may know
        WatchLog names (watchlog: key, WatchLog.base, wl-* code blocks, watchlog-sync data.json).
        It stays free of i18n imports. Report any WatchLog knowledge that leaks elsewhere.
    - path: "scripts/**"
      instructions: |
        Local dev tooling, run only by the maintainer on own machine.
        Not shipped, not in CI. Only report bugs that break the normal
        happy path. No security or filesystem-hardening findings.
    - path: "CLAUDE.md"
      instructions: "Agent instructions. Do not review policy content."
    - path: "docs/**"
      instructions: |
        Source-grounded wiki that agents read instead of the code. Each page lists the files it
        describes under `source`; index.md describes the whole tree. Report only statements that
        contradict the code (a confidently wrong page is the one defect that matters). Do not
        review style, completeness, wording, edge cases a page does not claim to cover, or the
        hand-written docs/values.md and docs/CLAUDE.md.
    - path: ".claude/**"
      instructions: "Agent skill docs, maintained by hand. Do not review."
  pre_merge_checks:
    docstrings:
      mode: "off"
